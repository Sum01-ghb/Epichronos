<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient -->
    <linearGradient id="dnaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>

  <!-- Left Strand -->
  <path d="M22 8 
           C 38 18, 38 30, 22 40
           C 6 50, 6 56, 22 60"
        stroke="url(#dnaGrad)"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Right Strand -->
  <path d="M42 8 
           C 26 18, 26 30, 42 40
           C 58 50, 58 56, 42 60"
        stroke="url(#dnaGrad)"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- DNA Rungs (Base pairs) -->
  <g stroke="url(#dnaGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <line x1="24" y1="14" x2="40" y2="14"/>
    <line x1="26" y1="22" x2="38" y2="22"/>
    <line x1="24" y1="30" x2="40" y2="30"/>
    <line x1="26" y1="38" x2="38" y2="38"/>
    <line x1="24" y1="46" x2="40" y2="46"/>
    <line x1="26" y1="54" x2="38" y2="54"/>
  </g>

  <!-- Subtle inner strands (adds richness) -->
  <g stroke="url(#dnaGrad)" stroke-width="1.2" opacity="0.6">
    <path d="M26 10 C 36 20, 36 28, 26 38 C 16 48, 16 54, 26 58" fill="none"/>
    <path d="M38 10 C 28 20, 28 28, 38 38 C 48 48, 48 54, 38 58" fill="none"/>
  </g>
</svg>